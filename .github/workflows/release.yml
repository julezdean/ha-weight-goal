name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach the HACS archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Fail if the manifest version does not match the tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/weight_goal/manifest.json'))['version'])")
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::tag $tag does not match manifest version $manifest"
            exit 1
          fi

      # HACS installs the archive contents into custom_components/weight_goal,
      # so the archive holds that directory's contents, the committed card
      # bundle under www included.
      - name: Build weight_goal.zip
        run: |
          cd custom_components/weight_goal
          zip -r "$GITHUB_WORKSPACE/weight_goal.zip" . \
            -x "__pycache__/*" "*/__pycache__/*" "*.pyc" ".DS_Store" "*/.DS_Store"
          unzip -l "$GITHUB_WORKSPACE/weight_goal.zip"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            weight_goal.zip --clobber
