name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install the frontend package
        # Without hass_frontend every test that touches lovelace fails with
        # "No module named 'hass_frontend'".
        run: |
          version=$(python -c "import json,pathlib;print(json.loads((pathlib.Path(__import__('homeassistant').__file__).parent/'components/frontend/manifest.json').read_text())['requirements'][0])")
          pip install "$version"

      - name: Lint
        run: ruff check --select F,E9 custom_components tests

      - name: Test
        run: pytest tests -q
