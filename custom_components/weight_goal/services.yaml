record_weight:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal
    weight:
      required: true
      example: 78.4
      selector:
        number:
          min: 1
          max: 500
          step: 0.1
          unit_of_measurement: kg
          mode: box
    timestamp:
      required: false
      example: "2026-09-01T07:30:00+02:00"
      selector:
        datetime:

set_goal:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal
    start_weight:
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 0.1
          unit_of_measurement: kg
          mode: box
    target_weight:
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 0.1
          unit_of_measurement: kg
          mode: box
    rate_per_week:
      required: false
      selector:
        number:
          min: -5
          max: 5
          step: 0.01
          mode: box
    start_date:
      required: false
      selector:
        date:
    end_date:
      required: false
      selector:
        date:
    tolerance:
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          unit_of_measurement: kg
          mode: box
    overdue_days:
      required: false
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: d
          mode: box

create_goal:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal
    name:
      required: true
      example: Summer
      selector:
        text:
    goal_mode:
      required: false
      default: target
      selector:
        select:
          options:
            - target
            - rate
          translation_key: goal_mode
    start_weight:
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 0.1
          unit_of_measurement: kg
          mode: box
    target_weight:
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 0.1
          unit_of_measurement: kg
          mode: box
    rate_per_week:
      required: false
      selector:
        number:
          min: -5
          max: 5
          step: 0.01
          mode: box
    start_date:
      required: false
      selector:
        date:
    end_date:
      required: true
      selector:
        date:
    tolerance:
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          unit_of_measurement: kg
          mode: box
    overdue_days:
      required: false
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: d
          mode: box
    activate:
      required: false
      default: true
      selector:
        boolean:

reset_goal:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal

ignore_last_measurement:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal

get_measurements:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal
    days:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 3650
          step: 1
          mode: box

import_history:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal
    source_entity:
      required: false
      selector:
        entity:
          domain:
            - sensor
            - number
            - input_number
    days:
      required: false
      default: 365
      selector:
        number:
          min: 1
          max: 730
          step: 1
          unit_of_measurement: d
          mode: box
    replace:
      required: false
      default: false
      selector:
        boolean:
    write_statistics:
      required: false
      default: false
      selector:
        boolean:

delete_measurement:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: weight_goal
    timestamp:
      required: true
      example: "2026-09-01T07:42:00+02:00"
      selector:
        datetime:
    tolerance_minutes:
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
