<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- confidence zone: flat single color -->
  <path d="M 90 1
           L 980 735
           L 980 1014.5
           L 90 280.3
           Z"
        fill="#2563eb" fill-opacity="0.14"/>

  <!-- zone dashed borders -->
  <line x1="90" y1="1" x2="980" y2="735" stroke="#2563eb" stroke-width="4" stroke-dasharray="14 10" opacity="0.55"/>
  <line x1="90" y1="280.3" x2="980" y2="1014.5" stroke="#2563eb" stroke-width="4" stroke-dasharray="14 10" opacity="0.55"/>

  <!-- center line, like a road marking -->
  <line x1="90" y1="140.65" x2="980" y2="874.75" stroke="#ffffff" stroke-width="6" stroke-dasharray="28 22" opacity="0.9"/>

  <!-- glow behind endpoint -->
  <circle cx="954.8" cy="856.9" r="70" fill="#2563eb" opacity="0.25" filter="url(#softBlur)"/>

  <!-- main curve: single flat color, no gradient -->
  <path d="M 90.2 127.7
           C 160.4 322.4, 230.5 517.2, 300.7 544.1
           C 350.8 563.3, 401.0 496.9, 451.1 448.8
           C 533.8 369.5, 616.5 340.2, 699.2 413.4
           C 784.4 488.8, 869.6 672.8, 954.8 856.9"
        fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start marker -->
  <circle cx="90.2" cy="127.7" r="16" fill="#2563eb"/>

  <!-- endpoint marker with ring -->
  <circle cx="954.8" cy="856.9" r="38" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 7" opacity="0.55"/>
  <circle cx="954.8" cy="856.9" r="19" fill="#2563eb"/>
  <circle cx="954.8" cy="856.9" r="9" fill="#ffffff"/>
</svg>
